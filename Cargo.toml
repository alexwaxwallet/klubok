[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/alexwaxwallet/klubok"

[workspace.dependencies]
klubok-proto = { path = "crates/klubok-proto" }
klubok-automation = { path = "crates/klubok-automation" }
klubok-map = { path = "crates/klubok-map" }
klubok-core = { path = "crates/klubok-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
